name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main, master, 'release/**']

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Validar el título del PR (Conventional Commits)
        # El título llega por variable de entorno y nunca se interpola en el script: un título con comillas o
        # con $(...) no puede ejecutar nada. Tampoco se imprime, para que no pueda inyectar comandos de workflow.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          patron='^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert)(\([a-z0-9._-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$patron"; then
            echo "El título del PR tiene el formato de Conventional Commits."
            exit 0
          fi
          echo "::error title=Título de PR inválido::El título tiene que seguir Conventional Commits: tipo(alcance): descripción"
          echo "Tipos válidos: feat, fix, chore, docs, refactor, test, ci, perf, build, revert."
          echo "El alcance es opcional, en minúsculas (letras, números, punto, guion o guion bajo)."
          echo "Un ! antes de los dos puntos marca un cambio incompatible."
          echo "Ejemplos:"
          echo "  feat(odapi): cifrar la query hacia la fachada"
          echo "  fix: devolver 502 cuando la fachada no contesta"
          echo "  feat(auth)!: exigir la clave interna en el login"
          exit 1
